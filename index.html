<script>
  const OPENAI_BASE = "https://api.openai.com/v1/chatkit";
  let clientSecret = null;
  let threadId = null;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const typingEl = document.getElementById('typing');
  const errorBanner = document.getElementById('error-banner');

  function showError(message) {
    errorBanner.textContent = message;
    errorBanner.classList.add('show');
    setTimeout(() => errorBanner.classList.remove('show'), 5000);
  }

  function addMessage(text, role = 'user') {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${role}`;

    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    messageDiv.innerHTML = `
      <div class="message-avatar">${role === 'user' ? '👤' : '🤖'}</div>
      <div>
        <div class="message-bubble">${text}</div>
        <div class="message-time">${time}</div>
      </div>
    `;

    messagesEl.insertBefore(messageDiv, typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function ensureSession() {
    if (clientSecret) return;

    const res = await fetch(`/api/chatkit/session`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: "guest-" + Date.now() })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.hint || data.problem || "Session creation failed");
    }

    clientSecret = data.client_secret;
  }

  async function sendMessage() {
    const message = inputEl.value.trim();
    if (!message) return;

    inputEl.value = '';
    inputEl.disabled = true;
    sendBtn.disabled = true;

    addMessage(message, 'user');
    typingEl.classList.add('active');

    try {
      await ensureSession();

      let url;
      let body;

      if (!threadId) {
        // Create thread
        url = `${OPENAI_BASE}/threads`;

        body = {
          initial_items: [
            {
              type: "user_message",
              content: [
                { type: "input_text", text: message }
              ]
            }
          ]
        };
      } else {
        // Add item to existing thread
        url = `${OPENAI_BASE}/threads/${threadId}/items`;

        body = {
          type: "user_message",
          content: [
            { type: "input_text", text: message }
          ]
        };
      }

      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "OpenAI-Beta": "chatkit_beta=v1",
          "ChatKit-Client-Secret": clientSecret
        },
        body: JSON.stringify(body)
      });

      const data = await res.json();

      if (!res.ok) {
        console.error("OpenAI error:", data);
        throw new Error(data.error?.message || "OpenAI error");
      }

      if (!threadId) {
        threadId = data.id;
      }

      // Now fetch latest thread state to get assistant response
      const threadRes = await fetch(`${OPENAI_BASE}/threads/${threadId}`, {
        headers: {
          "OpenAI-Beta": "chatkit_beta=v1",
          "ChatKit-Client-Secret": clientSecret
        }
      });

      const threadData = await threadRes.json();

      const items = threadData.items || [];
      const lastAssistant = [...items].reverse().find(i => i.type === "assistant_message");

      let assistantText = "No response";
      if (lastAssistant?.content?.[0]?.text) {
        assistantText = lastAssistant.content[0].text;
      }

      addMessage(assistantText, 'assistant');

    } catch (err) {
      console.error(err);
      showError(err.message);
      addMessage("Something went wrong.", "assistant");
    } finally {
      typingEl.classList.remove('active');
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);

  inputEl.addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      sendMessage();
    }
  });

  window.addEventListener("load", () => {
    ensureSession().catch(err => showError(err.message));
  });
</script>
