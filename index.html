<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DoAH — ChatKit Embed</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>body{margin:0;font-family:system-ui}#chat-root{height:100vh}</style>
</head>
<body>
  <div id="chat-root"></div>

  <!-- Load ChatKit web component from OpenAI's hosted package (CDN). -->
  <!-- If your policy or network blocks jsDelivr, use the recommended script url from docs. -->
  <script src="https://cdn.jsdelivr.net/npm/@openai/chatkit@latest/dist/chatkit.min.js"></script>

  <script>
    // Gets called by ChatKit to obtain client_secret for the widget.
    async function getClientSecret(currentClientSecret) {
      // If we already have an unexpired secret, return it
      if (currentClientSecret) return currentClientSecret;

      // Else fetch one from our server
      const res = await fetch('/api/chatkit/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: 'guest-' + Date.now() })
      });
      const body = await res.json();
      if (!res.ok) {
        console.error('Failed to get client_secret', body);
        throw new Error(body.hint || body.problem || 'Session creation failed');
      }
      return body.client_secret;
    }

    (async () => {
      // Create the ChatKit element and mount into the DOM
      const chatkit = document.createElement('openai-chatkit');

      // The widget uses the getClientSecret method internally
      chatkit.setOptions({
        api: {
          async getClientSecret(currentClientSecret) {
            return await getClientSecret(currentClientSecret);
          }
        },
        // Optional UI/customization options here (title, placeholder, theme...)
      });

      document.getElementById('chat-root').appendChild(chatkit);
    })();
  </script>
</body>
</html>
