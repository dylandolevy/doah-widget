<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatKit Workflow Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      width: 100%;
      max-width: 450px;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .header p {
      font-size: 14px;
      opacity: 0.9;
    }
    
    .status {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }
    
    .status.loading {
      background: #fff3cd;
      color: #856404;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
    }
    
    #my-chat {
      width: 100%;
      height: 600px;
      background: #fafafa;
    }
    
    button {
      margin: 12px 24px;
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    
    button:hover {
      background: #5568d3;
    }
    
    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 DoAH Assistant</h1>
      <p>Powered by OpenAI Workflow</p>
    </div>
    
    <div id="status" class="status loading">
      <span class="loading-spinner"></span>
      Initializing ChatKit...
    </div>
    
    <button id="reload-btn" style="display: none;" onclick="window.location.reload()">
      Reload Widget
    </button>
    
    <!-- ChatKit will mount here -->
    <div id="my-chat"></div>
  </div>

  <script>
    const VERCEL_API = 'https://doah-widget.vercel.app';
    
    function updateStatus(message, type = 'loading') {
      const el = document.getElementById('status');
      const spinner = type === 'loading' ? '<span class="loading-spinner"></span>' : '';
      el.innerHTML = spinner + message;
      el.className = `status ${type}`;
      console.log(`[${type.toUpperCase()}] ${message}`);
    }
    
    // Global API configuration for ChatKit
    window.chatkitAPI = {
      async getClientSecret(currentClientSecret) {
        try {
          if (!currentClientSecret) {
            updateStatus('Creating session...', 'loading');
            console.log('Creating new session...');
            
            const res = await fetch(`${VERCEL_API}/api/chatkit/session`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ user: 'guest-' + Date.now() })
            });
            
            if (!res.ok) {
              const errorData = await res.json();
              throw new Error(errorData.problem || errorData.hint || `HTTP ${res.status}`);
            }
            
            const data = await res.json();
            console.log('Session response:', data);
            
            if (!data.client_secret) {
              throw new Error('No client_secret in response');
            }
            
            updateStatus('✅ Connected!', 'success');
            setTimeout(() => {
              const statusEl = document.getElementById('status');
              statusEl.style.display = 'none';
            }, 2000);
            
            return data.client_secret;
          }
          
          // Refresh session
          console.log('Refreshing session...');
          updateStatus('Refreshing...', 'loading');
          
          const res = await fetch(`${VERCEL_API}/api/chatkit/refresh`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ client_secret: currentClientSecret })
          });
          
          if (!res.ok) {
            const errorData = await res.json();
            throw new Error(errorData.problem || errorData.hint || `HTTP ${res.status}`);
          }
          
          const data = await res.json();
          console.log('Session refreshed');
          return data.client_secret;
          
        } catch (error) {
          updateStatus(`❌ Error: ${error.message}`, 'error');
          document.getElementById('reload-btn').style.display = 'block';
          console.error('API error:', error);
          throw error;
        }
      }
    };
    
    // Initialize ChatKit when script loads
    function initChatKit() {
      updateStatus('Configuring ChatKit...', 'loading');
      
      const container = document.getElementById('my-chat');
      
      // Check if ChatKit loaded and added methods to the container
      if (container && typeof container.setOptions === 'function') {
        console.log('Using setOptions method');
        container.setOptions({
          api: window.chatkitAPI
        });
      } else {
        console.log('Waiting for ChatKit to inject into container...');
        // ChatKit might inject itself automatically
        // Just wait and see if it works
        setTimeout(() => {
          if (container && typeof container.setOptions === 'function') {
            container.setOptions({ api: window.chatkitAPI });
          } else {
            updateStatus('⚠️ ChatKit loading... Please wait', 'info');
          }
        }, 2000);
      }
    }
    
    // Wait for DOM and script
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(initChatKit, 1000);
      });
    } else {
      setTimeout(initChatKit, 1000);
    }
  </script>
  
  <!-- Load ChatKit CDN -->
  <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js" async></script>
</body>
</html>
