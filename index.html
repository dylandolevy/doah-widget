<script>
(() => {
  // Replace with your deployed Vercel base URL (no trailing slash)
  const VERCEL_BASE = "https://doah-widget.vercel.app";

  // in-memory cache for current client secret and expiry
  let cachedSecret = null;
  let cachedExpiresAt = 0; // unix seconds

  function debugLog(obj) {
    try { document.getElementById("debug").textContent = JSON.stringify(obj, null, 2); } catch(e) {}
    console.debug("ChatKit debug:", obj);
  }

  async function requestNewSession(userId = null) {
    const body = userId ? { user: userId } : {};
    const res = await fetch(`${VERCEL_BASE}/api/chatkit/session`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const j = await res.json();
    if (!res.ok) throw new Error("session creation failed: " + (j?.error?.message || JSON.stringify(j)));
    cachedSecret = j.client_secret;
    if (j.expires_at) cachedExpiresAt = Number(j.expires_at);
    debugLog({ action: "new_session", payload: j });
    return cachedSecret;
  }

  async function refreshSession(currentSecret) {
    const res = await fetch(`${VERCEL_BASE}/api/chatkit/refresh`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ client_secret: currentSecret })
    });
    const j = await res.json();
    if (!res.ok) throw new Error("refresh failed: " + (j?.error?.message || JSON.stringify(j)));
    cachedSecret = j.client_secret;
    if (j.expires_at) cachedExpiresAt = Number(j.expires_at);
    debugLog({ action: "refresh", payload: j });
    return cachedSecret;
  }

  async function getClientSecret(currentClientSecret) {
    try {
      if (!currentClientSecret && !cachedSecret) return await requestNewSession("guest-" + Date.now());
      if (currentClientSecret && !cachedSecret) {
        cachedSecret = currentClientSecret;
        return await requestNewSession();
      }
      const nowSec = Math.floor(Date.now() / 1000);
      const secondsLeft = cachedExpiresAt - nowSec;
      if (cachedExpiresAt && secondsLeft <= 30) return await refreshSession(cachedSecret);
      return cachedSecret;
    } catch (err) {
      console.error("getClientSecret error:", err);
      debugLog({ action: "error", message: String(err) });
      throw err;
    }
  }

  // robust mounting logic (unchanged)
  function getChatKitConstructor() {
    if (typeof window.ChatKit === "function") return window.ChatKit;
    if (window.ChatKit && typeof window.ChatKit.default === "function") return window.ChatKit.default;
    if (window.ChatKit && typeof window.ChatKit.ChatKit === "function") return window.ChatKit.ChatKit;
    if (window.ChatKit && typeof window.ChatKit.mount === "function") return window.ChatKit.mount;
    return null;
  }

  async function mountChat() {
    const chatEl = document.getElementById("my-chat");
    if (!chatEl) { console.error("mountChat: #my-chat not found"); return; }

    if (chatEl.chatkit && chatEl.chatkit.setOptions) {
      console.log("mountChat: widget already mounted — updating options");
      try {
        await chatEl.chatkit.setOptions({
          api: { async getClientSecret(current) { return await getClientSecret(current); } }
        });
      } catch (e) { console.error("mountChat update failed:", e); }
      return;
    }

    const start = Date.now();
    while (!window.ChatKit && Date.now() - start < 8000) {
      await new Promise(r => setTimeout(r, 100));
    }

    const CtorOrMount = getChatKitConstructor();
    if (!CtorOrMount) {
      console.error("mountChat: no ChatKit constructor found. window.ChatKit =", window.ChatKit);
      try { document.getElementById("debug").textContent = JSON.stringify(window.ChatKit, Object.getOwnPropertyNames(window.ChatKit||{}), 2); } catch(e) {}
      return;
    }

    try {
      let instance;
      if (CtorOrMount === window.ChatKit?.mount) {
        instance = await CtorOrMount(chatEl, {
          api: { async getClientSecret(current) { return await getClientSecret(current); } }
        });
      } else {
        instance = new CtorOrMount(chatEl);
        if (instance && typeof instance.setOptions === "function") {
          await instance.setOptions({
            api: { async getClientSecret(current) { return await getClientSecret(current); } }
          });
        } else if (typeof instance === "object" && instance !== null) {
          console.warn("mountChat: created ChatKit instance but no setOptions found. instance:", instance);
        }
      }
      chatEl.chatkit = instance || { mountedWithMountFn: true };
      console.log("mountChat: ChatKit mounted", chatEl.chatkit);
    } catch (err) {
      console.error("mountChat: failed to instantiate ChatKit:", err);
    }
  }

  // Reload button handler
  document.getElementById("reload-widget").addEventListener("click", async () => {
    const chatEl = document.getElementById("my-chat");
    if (chatEl && chatEl.chatkit) {
      try {
        if (typeof chatEl.chatkit.unmount === "function") chatEl.chatkit.unmount();
        else chatEl.innerHTML = "";
      } catch (e) {
        console.warn("reload: unmount failed:", e);
        chatEl.innerHTML = "";
      }
      chatEl.chatkit = null;
    } else if (chatEl) {
      chatEl.innerHTML = "";
    }
    cachedSecret = null; cachedExpiresAt = 0;
    await new Promise(r => setTimeout(r, 100));
    await loadAndMountChatKit(); // ensure we load the script if needed
  });

  // DYNAMIC SCRIPT LOADER: ensures the CDN script actually loads
  function loadScriptOnce(src, timeout = 8000) {
    return new Promise((resolve, reject) => {
      // If already available, resolve immediately
      if (window.ChatKit) return resolve(window.ChatKit);

      // If a script tag with same src exists, attach to its events
      const existing = Array.from(document.getElementsByTagName("script")).find(s => s.src === src);
      if (existing) {
        existing.addEventListener("load", () => resolve(window.ChatKit));
        existing.addEventListener("error", (e) => reject(new Error("Script load error")));
        return;
      }

      const s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.onload = () => resolve(window.ChatKit);
      s.onerror = () => reject(new Error("Failed to load ChatKit script " + src));
      document.head.appendChild(s);

      setTimeout(() => {
        reject(new Error("Timed out loading ChatKit script: " + src));
      }, timeout);
    });
  }

  // orchestrator: load script then mount
  async function loadAndMountChatKit() {
    const CHATKIT_SRC = "https://cdn.platform.openai.com/deployments/chatkit/chatkit.js";
    try {
      await loadScriptOnce(CHATKIT_SRC, 10000);
      console.log("ChatKit script loaded, attempting mount");
      await mountChat();
    } catch (err) {
      console.error("Error loading ChatKit script:", err);
      debugLog({ action: "script_load_failed", message: String(err) });
    }
  }

  // Initialize: load script and mount on DOMContentLoaded
  document.addEventListener("DOMContentLoaded", () => {
    loadAndMountChatKit();
  });
})();
</script>
