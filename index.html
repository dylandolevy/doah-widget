<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DoAH Assistant — debug restore</title>
  <style>
    /* simplified styles so the page definitely shows */
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);padding:20px}
    .chat-container{width:100%;max-width:700px;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:hidden;display:flex;flex-direction:column;height:640px}
    .chat-header{padding:20px;background:linear-gradient(135deg,#667eea,#764ba2);color:white}
    .messages{flex:1;padding:16px;overflow:auto;background:#f7f8fb}
    .input-area{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #eee}
    #message-input{flex:1;padding:10px;border-radius:8px;border:1px solid #ddd}
    #send-btn{padding:10px 16px;border-radius:8px;border:none;background:#667eea;color:#fff;cursor:pointer}
    .error-banner{display:none;padding:10px;background:#fdecea;color:#611; margin:12px}
    .error-banner.show{display:block}
    .message{margin-bottom:12px}
    .assistant{color:#111}
    .user{color:#444;text-align:right}
  </style>
</head>
<body>
  <div class="chat-container" id="app">
    <div class="chat-header">
      <strong>DoAH Assistant (debug)</strong>
      <div style="font-size:12px;opacity:.9">This page renders even if API calls fail — check console & network.</div>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <div id="messages" class="messages">
      <div class="message assistant">🤖 Hello! UI restored.</div>
    </div>

    <div class="input-area">
      <input id="message-input" placeholder="Type a message..." />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    // defensive boot logs so you can see script loaded
    console.log("[index.html] booting script");

    // DOM refs
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const errorBanner = document.getElementById('error-banner');

    function showError(msg) {
      console.error("[app error]", msg);
      errorBanner.textContent = msg;
      errorBanner.classList.add('show');
      setTimeout(()=> errorBanner.classList.remove('show'), 5000);
    }

    function appendMessage(text, cls = 'assistant') {
      const d = document.createElement('div');
      d.className = 'message ' + cls;
      d.textContent = (cls === 'user' ? '👤 ' : '🤖 ') + text;
      messagesEl.appendChild(d);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Minimal safe send — DOES NOT break page if fetch fails.
    async function sendMessage() {
      const text = inputEl.value && inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      appendMessage(text, 'user');

      // Show temporary typing placeholder
      appendMessage('…waiting for response (demo)', 'assistant');

      try {
        // This demo does nothing heavy. If you want full ChatKit flow, uncomment below and
        // adapt per whether you're running Next.js or static site.
        // Example safe call to your session endpoint:
        /*
        const resp = await fetch('/api/chatkit/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: 'guest-' + Date.now() })
        });
        const payload = await resp.json();
        if (!resp.ok) throw new Error(payload.hint || payload.problem || 'session failed');
        console.log('session payload', payload);
        appendMessage('Session created (see console).', 'assistant');
        */

        // Demo reply:
        setTimeout(()=>{
          // replace last assistant placeholder
          const list = messagesEl.querySelectorAll('.message.assistant');
          const last = list[list.length - 1];
          if (last) last.textContent = '🤖 Demo reply — your message was received.';
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }, 800);

      } catch (err) {
        // Replace last assistant placeholder with error
        const list = messagesEl.querySelectorAll('.message.assistant');
        const last = list[list.length - 1];
        if (last) last.textContent = '🤖 Error fetching response — see console.';
        showError(err.message || String(err));
      }
    }

    // Events
    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // sanity check: script loaded
    console.log("[index.html] script loaded, UI should be visible");

  </script>
</body>
</html>
